<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>You've Been Rickrolled!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #172b3b, #304b60);
      color: #f5e9d4;
      font-family: Georgia, serif;
      text-align: center;
    }

    .magic-container {
      padding: 25px;
      width: min(90%, 600px);
    }

    h1 {
      color: #eacb83;
      font-size: 32px;
    }

    .video-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      margin: 25px 0;
      border: 3px solid #eacb83;
      border-radius: 14px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .enter-btn {
      display: inline-block;
      padding: 15px 30px;
      background: #eacb83;
      color: #182b3c;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
      font-size: 17px;
    }

    .enter-btn:hover {
      background: #fff0c7;
    }
  </style>
</head>
<body>
  <main class="magic-container">
    <h1>✨ YOU'VE BEEN RICKROLLED! ✨</h1>
    <p>Never gonna give you up...</p>

    <div class="video-frame">
      <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
        title="Rick Astley - Never Gonna Give You Up"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <p>Enjoy your magical surprise!</p>

    <a class="enter-btn" href="/">
      ✦ Enter Nicole Alonso's Website ✦
    </a>
  </main>
</body>
</html>
